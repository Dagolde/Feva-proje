{% extends "qa/layout.html" %}

{% block dashboard_content %}
<div class="page-header">
    <h2>QA Records</h2>
    <p>Review and manage enumeration records</p>
</div>

<!-- Filter Controls -->
<div class="card" style="margin-bottom: 20px;">
    <h3 style="margin-bottom: 16px;">Filters</h3>
    <div class="filter-grid">
        <div class="form-group">
            <label for="filterStatus">Status</label>
            <select id="filterStatus">
                <option value="">All Statuses</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
                <option value="flagged">Flagged</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="filterEntityType">Record Type</label>
            <select id="filterEntityType">
                <option value="">All Types</option>
                <option value="building">Building</option>
                <option value="street">Street</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="filterLga">LGA</label>
            <input type="text" id="filterLga" placeholder="Enter LGA name">
        </div>
        
        <div class="form-group">
            <label for="filterWard">Ward</label>
            <input type="text" id="filterWard" placeholder="Enter ward name">
        </div>
        
        <div class="form-group">
            <label for="filterEnumerator">Enumerator</label>
            <input type="text" id="filterEnumerator" placeholder="Enter username">
        </div>
        
        <div class="form-group">
            <label for="filterStartDate">Start Date</label>
            <input type="date" id="filterStartDate">
        </div>
        
        <div class="form-group">
            <label for="filterEndDate">End Date</label>
            <input type="date" id="filterEndDate">
        </div>
        
        <div class="form-group" style="display: flex; align-items: flex-end; gap: 8px;">
            <button class="btn" onclick="applyFilters()" style="flex: 1;">Apply Filters</button>
            <button class="btn btn-secondary" onclick="clearFilters()" style="flex: 1;">Clear</button>
        </div>
    </div>
</div>

<!-- Records Statistics -->
<div class="stats-grid" style="margin-bottom: 20px;">
    <div class="stat-card">
        <div class="stat-label">Total Records</div>
        <div class="stat-value" id="totalRecords">-</div>
    </div>
    <div class="stat-card" style="border-left: 4px solid #856404;">
        <div class="stat-label">Pending</div>
        <div class="stat-value" id="pendingCount" style="color: #856404;">-</div>
    </div>
    <div class="stat-card" style="border-left: 4px solid #27ae60;">
        <div class="stat-label">Approved</div>
        <div class="stat-value" id="approvedCount" style="color: #27ae60;">-</div>
    </div>
    <div class="stat-card" style="border-left: 4px solid #c0392b;">
        <div class="stat-label">Rejected</div>
        <div class="stat-value" id="rejectedCount" style="color: #c0392b;">-</div>
    </div>
</div>

<!-- Page Size Selection -->
<div class="action-bar" style="margin-bottom: 16px;">
    <div class="action-bar-left">
        <label for="pageSize" style="margin-right: 8px;">Records per page:</label>
        <select id="pageSize" onchange="changePageSize()" style="width: auto;">
            <option value="10">10</option>
            <option value="25">25</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
        </select>
    </div>
    <div class="action-bar-right">
        <span id="recordCount" style="color: #666; font-size: 14px;">-</span>
    </div>
</div>

<!-- Records Table -->
<div class="card">
    <table id="recordsTable">
        <thead>
            <tr>
                <th>Type</th>
                <th>Record ID</th>
                <th>LGA</th>
                <th>Ward</th>
                <th>Enumerator</th>
                <th>Submitted</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="recordsTableBody">
            <tr>
                <td colspan="8" style="text-align: center; padding: 40px;">
                    <div class="spinner"></div>
                    <p style="margin-top: 16px; color: #666;">Loading records...</p>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Pagination -->
<div class="pagination" id="pagination"></div>

<!-- Last Update Time -->
<div style="text-align: center; margin-top: 24px; color: #999; font-size: 12px;" id="lastRefreshTime">
    Last updated: --
</div>

<style>
    .filter-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
    }
    
    .action-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
    }
    
    .action-bar-left,
    .action-bar-right {
        display: flex;
        gap: 12px;
        align-items: center;
    }
    
    .record-row {
        cursor: pointer;
    }
    
    .record-row:hover {
        background-color: #f8f9fa;
    }
    
    .badge-building {
        background: #e3f2fd;
        color: #0d47a1;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 500;
    }
    
    .badge-street {
        background: #f3e5f5;
        color: #4a148c;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 500;
    }
    
    @media (max-width: 768px) {
        .filter-grid {
            grid-template-columns: 1fr;
        }
        
        .action-bar {
            flex-direction: column;
            align-items: stretch;
        }
        
        .action-bar-left,
        .action-bar-right {
            width: 100%;
        }
    }
</style>

<script src="/static/js/common.js"></script>
<script>
    let currentPage = 1;
    let pageSize = 50;
    let currentFilters = {};
    let allRecords = [];
    
    // Initialize page
    document.addEventListener('DOMContentLoaded', async function() {
        // Load filters from URL query parameters
        loadFiltersFromUrl();
        
        // Load records
        await loadRecords();
        
        // Start auto-refresh every 60 seconds (QA dashboard requirement)
        startAutoRefresh(loadRecords, 60);
    });
    
    // Load filters from URL query parameters
    function loadFiltersFromUrl() {
        const params = getQueryParams();
        
        if (params.status) {
            document.getElementById('filterStatus').value = params.status;
            currentFilters.status = params.status;
        }
        if (params.entity_type) {
            document.getElementById('filterEntityType').value = params.entity_type;
            currentFilters.entity_type = params.entity_type;
        }
        if (params.lga) {
            document.getElementById('filterLga').value = params.lga;
            currentFilters.lga = params.lga;
        }
        if (params.ward) {
            document.getElementById('filterWard').value = params.ward;
            currentFilters.ward = params.ward;
        }
        if (params.enumerator) {
            document.getElementById('filterEnumerator').value = params.enumerator;
            currentFilters.enumerator = params.enumerator;
        }
        if (params.start_date) {
            document.getElementById('filterStartDate').value = params.start_date;
            currentFilters.start_date = params.start_date;
        }
        if (params.end_date) {
            document.getElementById('filterEndDate').value = params.end_date;
            currentFilters.end_date = params.end_date;
        }
        if (params.page) {
            currentPage = parseInt(params.page);
        }
        if (params.page_size) {
            pageSize = parseInt(params.page_size);
            document.getElementById('pageSize').value = pageSize;
        }
    }
    
    // Apply filters
    function applyFilters() {
        currentFilters = {
            status: document.getElementById('filterStatus').value || undefined,
            entity_type: document.getElementById('filterEntityType').value || undefined,
            lga: document.getElementById('filterLga').value || undefined,
            ward: document.getElementById('filterWard').value || undefined,
            enumerator: document.getElementById('filterEnumerator').value || undefined,
            start_date: document.getElementById('filterStartDate').value || undefined,
            end_date: document.getElementById('filterEndDate').value || undefined,
        };
        
        // Remove undefined values
        Object.keys(currentFilters).forEach(key => {
            if (currentFilters[key] === undefined) {
                delete currentFilters[key];
            }
        });
        
        // Reset to page 1 when filters change
        currentPage = 1;
        
        // Update URL
        updateQueryParams({
            ...currentFilters,
            page: currentPage,
            page_size: pageSize,
        });
        
        // Load records with new filters
        loadRecords();
    }
    
    // Clear filters
    function clearFilters() {
        document.getElementById('filterStatus').value = '';
        document.getElementById('filterEntityType').value = '';
        document.getElementById('filterLga').value = '';
        document.getElementById('filterWard').value = '';
        document.getElementById('filterEnumerator').value = '';
        document.getElementById('filterStartDate').value = '';
        document.getElementById('filterEndDate').value = '';
        
        currentFilters = {};
        currentPage = 1;
        
        // Update URL
        updateQueryParams({
            page: currentPage,
            page_size: pageSize,
        });
        
        // Load records
        loadRecords();
    }
    
    // Load records from API
    async function loadRecords() {
        try {
            // Build query string
            const params = new URLSearchParams({
                page: currentPage,
                page_size: pageSize,
                ...currentFilters,
            });
            
            const response = await apiRequest(`/api/v1/qa/records?${params}`);
            if (response && response.ok) {
                const data = await response.json();
                allRecords = data.items;
                renderRecords(data.items);
                renderPagination(data.total, data.page, data.page_size);
                updateRecordCount(data.total, data.page, data.page_size);
                updateStatistics(data.items);
                updateLastRefreshTime();
            } else {
                showNotification('Failed to load records', 'error');
            }
        } catch (error) {
            console.error('Error loading records:', error);
            showNotification('Error loading records', 'error');
        }
    }
    
    // Render records table
    function renderRecords(records) {
        const tbody = document.getElementById('recordsTableBody');
        
        if (records.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="8" style="text-align: center; padding: 40px; color: #666;">
                        No records found matching the current filters
                    </td>
                </tr>
            `;
            return;
        }
        
        tbody.innerHTML = records.map(record => {
            const typeClass = record.entity_type === 'building' ? 'badge-building' : 'badge-street';
            const typeLabel = record.entity_type === 'building' ? 'Building' : 'Street';
            const submittedDate = formatDateTime(record.submitted_at);
            const statusBadge = getStatusBadge(record.status);
            const wardDisplay = record.ward || '-';
            
            return `
                <tr class="record-row" onclick="viewRecordDetail('${record.id}', '${record.entity_type}')">
                    <td><span class="${typeClass}">${typeLabel}</span></td>
                    <td>${escapeHtml(record.record_id)}</td>
                    <td>${escapeHtml(record.lga)}</td>
                    <td>${escapeHtml(wardDisplay)}</td>
                    <td>${escapeHtml(record.enumerator_username)}</td>
                    <td>${submittedDate}</td>
                    <td>${statusBadge}</td>
                    <td>
                        <button class="btn btn-secondary btn-icon" onclick="event.stopPropagation(); viewRecordDetail('${record.id}', '${record.entity_type}')">
                            View
                        </button>
                    </td>
                </tr>
            `;
        }).join('');
    }
    
    // Update record count display
    function updateRecordCount(total, page, pageSize) {
        const start = (page - 1) * pageSize + 1;
        const end = Math.min(page * pageSize, total);
        const countText = total > 0 
            ? `Showing ${start}-${end} of ${total} records`
            : 'No records found';
        document.getElementById('recordCount').textContent = countText;
    }
    
    // Update statistics
    function updateStatistics(records) {
        const total = records.length;
        const pending = records.filter(r => r.status === 'pending').length;
        const approved = records.filter(r => r.status === 'approved').length;
        const rejected = records.filter(r => r.status === 'rejected').length;
        
        document.getElementById('totalRecords').textContent = total;
        document.getElementById('pendingCount').textContent = pending;
        document.getElementById('approvedCount').textContent = approved;
        document.getElementById('rejectedCount').textContent = rejected;
    }
    
    // Render pagination
    function renderPagination(total, page, pageSize) {
        const totalPages = Math.ceil(total / pageSize);
        const pagination = document.getElementById('pagination');
        
        if (totalPages <= 1) {
            pagination.innerHTML = '';
            return;
        }
        
        let html = '';
        
        // Previous button
        html += `<button ${page === 1 ? 'disabled' : ''} onclick="changePage(${page - 1})">Previous</button>`;
        
        // Page numbers
        for (let i = 1; i <= totalPages; i++) {
            if (i === 1 || i === totalPages || (i >= page - 2 && i <= page + 2)) {
                html += `<button class="${i === page ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            } else if (i === page - 3 || i === page + 3) {
                html += '<span>...</span>';
            }
        }
        
        // Next button
        html += `<button ${page === totalPages ? 'disabled' : ''} onclick="changePage(${page + 1})">Next</button>`;
        
        pagination.innerHTML = html;
    }
    
    // Change page
    async function changePage(page) {
        currentPage = page;
        updateQueryParams({
            ...currentFilters,
            page: currentPage,
            page_size: pageSize,
        });
        await loadRecords();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    
    // Change page size
    async function changePageSize() {
        pageSize = parseInt(document.getElementById('pageSize').value);
        currentPage = 1; // Reset to first page
        updateQueryParams({
            ...currentFilters,
            page: currentPage,
            page_size: pageSize,
        });
        await loadRecords();
    }
    
    // View record detail
    function viewRecordDetail(recordId, entityType) {
        window.location.href = `/qa/records/${recordId}?entity_type=${entityType}`;
    }
    
    // Update last refresh time
    function updateLastRefreshTime() {
        const now = new Date();
        const timeString = now.toLocaleTimeString('en-US', {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
        });
        document.getElementById('lastRefreshTime').textContent = `Last updated: ${timeString}`;
    }
</script>
{% endblock %}
