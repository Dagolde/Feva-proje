name: feva_mobile
description: FEVA — Field Enumeration and Verification App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  drift: ^2.18.0
  # sqlcipher_flutter_libs 0.7.x is a no-op shim — it exists only to block the
  # old 0.6.x scripts. SQLCipher is now loaded via sqlite3 3.x build hooks.
  sqlcipher_flutter_libs: ^0.7.0
  # sqlite3 3.x uses build hooks to compile SQLCipher directly (no separate
  # Flutter plugin registration, so no duplicate dex conflict).
  sqlite3: ^3.1.0
  path: ^1.9.0

  # Security
  flutter_secure_storage: ^9.2.2

  # Location
  geolocator: ^12.0.0

  # Camera & media
  camera: ^0.11.0
  native_exif: ^0.7.0

  # Maps
  maplibre_gl: ^0.25.0

  # Background tasks
  workmanager: ^0.8.0

  # QR scanning
  mobile_scanner: ^5.2.3

  # QR code generation
  qr_flutter: ^4.1.0

  # Networking
  http: ^1.2.1

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Utilities
  path_provider: ^2.1.3
  crypto: ^3.0.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.1
  # Property-based testing — using dart:math Random + test package (no extra dep needed)

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Use SQLite3MultipleCiphers (sqlite3mc) instead of plain SQLite.
# This enables PRAGMA key encryption support without any separate Flutter plugin.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
